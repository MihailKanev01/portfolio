name: Portfolio smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local server
        run: nohup python3 -m http.server 4173 >/tmp/portfolio-server.log 2>&1 &

      - name: Wait for local server
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Test local build
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/portfolio.spec.js --reporter=line

      - name: Wait for GitHub Pages deployment
        run: |
          for i in {1..18}; do
            if curl -fsS https://mihailkanev01.github.io/portfolio/index.html | grep -q "Mihail Kanev"; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Test live GitHub Pages site
        env:
          BASE_URL: https://mihailkanev01.github.io/portfolio
        run: npx playwright test tests/portfolio.spec.js --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-playwright-report
          path: test-results/
          if-no-files-found: ignore
