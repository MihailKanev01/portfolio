name: EmailJS browser-origin integration test

on:
  push:
    branches: [main]

jobs:
  emailjs:
    runs-on: ubuntu-latest
    steps:
      - name: Test EmailJS with portfolio origin
        env:
          EMAILJS_SERVICE_ID: service_za0kkku
          EMAILJS_TEMPLATE_ID: template_drq3v2w
          EMAILJS_PUBLIC_KEY: OfeVQ08GZq8WkNqIj
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error             --request POST             --url https://api.emailjs.com/api/v1.0/email/send             --header 'Content-Type: application/json'             --header 'Origin: https://mihailkanev01.github.io'             --header 'Referer: https://mihailkanev01.github.io/portfolio/'             --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'             --data @- <<JSON
          {
            "service_id": "${EMAILJS_SERVICE_ID}",
            "template_id": "${EMAILJS_TEMPLATE_ID}",
            "user_id": "${EMAILJS_PUBLIC_KEY}",
            "template_params": {
              "name": "Mihail Portfolio Test",
              "email": "test@example.com",
              "from_name": "Mihail Portfolio Test",
              "reply_to": "test@example.com",
              "message": "Real browser-origin EmailJS integration test from the Mihail Kanev portfolio."
            }
          }
          JSON
          )
          echo "RESPONSE: $response"
